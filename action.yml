name: soroban-linter
description: Static analysis for Soroban smart contracts (auth, storage lifecycle, resource limits)
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Files or directories to lint
    default: "."
  fail-on:
    description: "Fail the step on findings at/above this severity: error, warning, note, never"
    default: error
  args:
    description: Extra arguments passed to soroban-linter (e.g. "--disable SG007")
    default: ""
  sarif:
    description: Also write a SARIF report and upload it to GitHub code scanning
    default: "true"

runs:
  using: composite
  steps:
    - name: Install soroban-linter
      shell: bash
      run: cargo install --locked --path "${{ github.action_path }}/crates/soroban-linter" --root "${{ runner.temp }}/soroban-linter"

    - name: Run soroban-linter
      shell: bash
      env:
        LINTER: ${{ runner.temp }}/soroban-linter/bin/soroban-linter
      run: |
        if [ "${{ inputs.sarif }}" = "true" ]; then
          "$LINTER" ${{ inputs.path }} ${{ inputs.args }} --format sarif --fail-on never -o soroban-linter.sarif
        fi
        "$LINTER" ${{ inputs.path }} ${{ inputs.args }} --fail-on ${{ inputs.fail-on }}

    - name: Upload SARIF
      if: always() && inputs.sarif == 'true' && hashFiles('soroban-linter.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: soroban-linter.sarif
        category: soroban-linter
