[package]
name = "soroban-linter"
default-run = "soroban-linter"
description = "Static analysis for Soroban smart contracts: auth, storage lifecycle and resource-limit detectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["soroban", "stellar", "linter", "static-analysis", "smart-contracts"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "soroban-linter"
path = "src/main.rs"

# Lets users run `cargo soroban-linter` once installed.
[[bin]]
name = "cargo-soroban-linter"
path = "src/bin/cargo-soroban-linter.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true
walkdir.workspace = true
